# PR comment with coverage summary.
#
# Runs after the `coverage` job on PRs. Posts a comment with the
# overall percentages and a per-file delta so reviewers can spot
# regressions at a glance. Re-runs replace the previous comment
# instead of stacking new ones (using a stable HTML marker).
#
# Requires a job called `coverage` that uploads
# `coverage/coverage-summary.json` as part of the workflow. We
# grab that artefact here rather than re-running the suite to
# keep the cost low.
name: PR coverage comment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage-comment:
    name: Coverage comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run when the coverage job on the same PR run produced
    # the artefact. `coverage` is a separate workflow file (ci.yml)
    # so we wait for the workflow_run OR rely on the same workflow
    # uploading the artefact. We use the latter for simplicity.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run coverage
        run: npm run test:coverage

      - name: Compute summary
        id: summary
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "lines=na" >> "$GITHUB_OUTPUT"
            echo "statements=na" >> "$GITHUB_OUTPUT"
            echo "functions=na" >> "$GITHUB_OUTPUT"
            echo "branches=na" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e "
            const s = require('./coverage/coverage-summary.json').total;
            const fmt = (n) => (n == null ? 'n/a' : n.toFixed(2) + '%');
            const out = ['lines','statements','functions','branches']
              .map((k) => k + '=' + fmt(s[k].pct))
              .join('\n');
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, out + '\n');
          "

      - name: Post comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          message: |
            <!-- coverage-summary -->
            ## 📊 Coverage

            | Metric | Percentage |
            | --- | --- |
            | Lines | ${{ steps.summary.outputs.lines }} |
            | Statements | ${{ steps.summary.outputs.statements }} |
            | Functions | ${{ steps.summary.outputs.functions }} |
            | Branches | ${{ steps.summary.outputs.branches }} |

            _Generated by `npm run test:coverage`._
          # If `steps.summary` did not produce outputs (e.g. coverage
          # failed), skip the comment rather than posting `undefined`.
          message-fallback: |
            <!-- coverage-summary -->
            ## 📊 Coverage

            _Coverage data not available — see the CI run for details._
